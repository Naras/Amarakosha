<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Amarakosha - Synonyms, Nishpatthi & Vyutpatthi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0f172a;
        --panel-bg: rgba(30, 41, 59, 0.7);
        --accent-color: #38bdf8;
        --accent-hover: #0ea5e9;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.1);
        --card-bg: rgba(15, 23, 42, 0.6);
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        font-family: 'Noto Sans', sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
                          radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%);
      }

      /* Navbar */
      #navbar {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 10px 20px;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      #navbar ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      #navbar li {
        display: inline-block;
        border: none;
        margin: 0;
      }

      #navbar li a {
        color: var(--text-muted);
        text-decoration: none;
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
        font-size: 1rem;
        padding: 8px 16px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #navbar li a:hover, #navbar li.active a {
        color: var(--text-main);
        background: rgba(56, 189, 248, 0.15);
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
      }

      /* Container */
      .app-container {
        max-width: 1400px;
        margin: 30px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 30px;
      }

      /* Header info */
      .header-section {
        grid-column: 1 / -1;
        text-align: center;
        margin-bottom: 20px;
      }

      .header-section h2 {
        font-family: 'Outfit', sans-serif;
        font-size: 2.5rem;
        margin: 0;
        background: linear-gradient(135deg, #f8fafc 30%, #38bdf8 90%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-section p {
        color: var(--text-muted);
        font-size: 1.1rem;
        margin-top: 5px;
      }

      /* Sidebar & Details panel */
      .sidebar {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 15px;
        position: sticky;
        top: 90px;
        box-sizing: border-box;
      }

      .sidebar label {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        color: var(--text-main);
        font-size: 1.1rem;
      }

      select#Dhatus {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-main);
        padding: 10px;
        font-size: 1rem;
        height: 250px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.3s ease;
      }

      select#Dhatus:focus {
        border-color: var(--accent-color);
      }

      button#DhatusButton {
        background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
        color: var(--bg-color);
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button#DhatusButton:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      }

      /* Details view */
      .details-panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(8px);
        min-height: 400px;
      }

      .details-panel h5 {
        font-family: 'Outfit', sans-serif;
        font-size: 1.5rem;
        margin: 0 0 20px 0;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
        color: var(--accent-color);
      }

      /* Form Fields */
      .field-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-group label {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .field-group input[type="text"], .field-group textarea {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-main);
        padding: 12px;
        font-size: 1.05rem;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        font-family: inherit;
      }

      .field-group input[type="text"]:focus, .field-group textarea:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
      }

      .field-group textarea {
        resize: vertical;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="navbar">
      <ul>
        <li class="active"><a href="webclient_Amara_Synonyms.html">Amarakosha</a></li>
        <li><a href="webclient_Subanta_Generate.html">Subanta</a></li>
        <li><a href="webclient_Tiganta_Generate.html">Tiganta</a></li>
        <li><a href="webclient_Krdanta_Generate.html">Krdanta</a></li>
        <li><a href="webclient_sentence_analyser.html">Analysis</a></li>
        <li><a href="index.html">Home</a></li>
      </ul>
    </div>

    <div class="app-container">
      <div class="header-section">
        <h2>Amarakosha</h2>
        <p>Explore Synonyms, Nishpatthi, and Vyutpatthi Lexicon</p>
      </div>

      <div class="sidebar">
        <label for="Dhatus">Select Dhatu</label>
        <select id="Dhatus" size="20"></select>
        <button id="DhatusButton">Get Synonyms</button>
      </div>

      <div id="dhatu" class="details-panel">
        <h5>Synonyms and Meanings</h5>
        <div style="color: var(--text-muted); text-align: center; margin-top: 50px;">
          Select a dhatu from the list and click "Get Synonyms" to view its details.
        </div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="config.js"></script>
    <script>
      // Populate Dhatus
      const DhatusSelect = document.getElementById("Dhatus");
      fetch(getApiUrl('Dhatus'))
        .then(response => response.json())
        .then(json => {
          dataArray = json['Amarakosha Dhatus'];
          dataArray.forEach((item, i) => {
            const option = document.createElement("option");
            option.value = i;
            option.text = item;
            DhatusSelect.appendChild(option);
          });
        });

      // Get Synonym Details
      const DhatusButton = document.getElementById("DhatusButton");
      DhatusButton.addEventListener("click", () => {
        dhatuSel = $("#Dhatus option:selected").text();
        if (!dhatuSel) return;
        const url2 = getApiUrl('Dhatu/' + encodeURIComponent(dhatuSel));

        fetch(url2)
          .then(response => response.json())
          .then(data => {
            const dhatuDiv = document.getElementById("dhatu");
            dhatuDiv.innerHTML = "<h5>Synonyms and Meanings: " + dhatuSel + "</h5>";
            dataArray = data['Amarakosha Dhatus'];

            Object.entries(dataArray).forEach(([key, value]) => {
              const fieldGroup = document.createElement("div");
              fieldGroup.className = "field-group";

              const label = document.createElement("label");
              label.htmlFor = key;
              label.textContent = key;
              fieldGroup.appendChild(label);

              if (Array.isArray(value)) {
                value = flattenArray(value);
              }
              const valString = value.join(", ");

              // Use textarea for long analytical fields, standard text input for short definitions
              if (key === "Nishpatthi" || key.startsWith("Vyutpatthi")) {
                const textarea = document.createElement("textarea");
                textarea.id = key;
                textarea.rows = 3;
                textarea.value = valString;
                fieldGroup.appendChild(textarea);
              } else {
                const textBox = document.createElement("input");
                textBox.type = "text";
                textBox.id = key;
                textBox.value = valString;
                fieldGroup.appendChild(textBox);
              }

              dhatuDiv.appendChild(fieldGroup);
            });
          });
      });

      function flattenArray(arr) {
        let flat = [];
        for (let i = 0; i < arr.length; i++) {
          if (Array.isArray(arr[i])) {
            flat = flat.concat(flattenArray(arr[i]));
          } else {
            flat.push(arr[i]);
          }
        }
        return flat;
      }
    </script>
  </body>
</html>
